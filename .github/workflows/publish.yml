name: Publish to pub.dev

# Publishing uses pub.dev automated publishing with GitHub OIDC tokens:
# https://dart.dev/tools/pub/automated-publishing
#
# Each package must enable "Automated publishing" on pub.dev with this
# repository and its own tag pattern:
#
# | Package                      | Tag pattern                                |
# |------------------------------|--------------------------------------------|
# | contactos                    | contactos-v{{version}}                     |
# | contactos_android            | contactos-android-v{{version}}             |
# | contactos_foundation         | contactos-foundation-v{{version}}          |
# | contactos_platform_interface | contactos-platform-interface-v{{version}}  |

on:
  push:
    tags:
      - "contactos-v[0-9]+.[0-9]+.[0-9]+*"
      - "contactos-android-v[0-9]+.[0-9]+.[0-9]+*"
      - "contactos-foundation-v[0-9]+.[0-9]+.[0-9]+*"
      - "contactos-platform-interface-v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MISE_VERSION: "2026.10.4"
  MIN_PANA_SCORE: "150"

jobs:
  prepare:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve package and validate versions
        id: resolve
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Unsupported tag '$tag'."
            exit 1
          fi
          package="${BASH_REMATCH[1]//-/_}"
          version="${BASH_REMATCH[2]}"
          if [[ ! -f "$package/pubspec.yaml" ]]; then
            echo "::error::Package directory '$package' does not exist."
            exit 1
          fi
          pubspec_version=$(awk '/^version:/ { print $2; exit }' "$package/pubspec.yaml")
          changelog_version=$(awk '/^## / { print $2; exit }' "$package/CHANGELOG.md")
          if [[ "$pubspec_version" != "$version" || "$changelog_version" != "$version" ]]; then
            echo "::error::Tag ($version), $package/pubspec.yaml ($pubspec_version) and the first $package/CHANGELOG.md entry ($changelog_version) must match."
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $package $version"

  publish:
    name: Validate and publish ${{ needs.prepare.outputs.package }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Required for pub.dev OIDC authentication
    defaults:
      run:
        working-directory: ${{ needs.prepare.outputs.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: flutter

      - name: Install dependencies
        run: |
          flutter pub get
          if [[ -d example ]]; then
            (cd example && flutter pub get)
          fi

      - name: Check format
        run: make format-check

      - name: Check analyzer
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --no-pub test/

      - name: Verify pub score
        run: |
          dart pub global activate pana
          pana_output=$(dart pub global run pana . --no-warning)
          printf '%s\n' "$pana_output"
          score=$(printf '%s\n' "$pana_output" | sed -nE 's/.*Points: ([0-9]+)\/[0-9]+.*/\1/p')
          if [[ ! "$score" =~ ^[0-9]+$ ]] || (( score < MIN_PANA_SCORE )); then
            echo "::error::Minimum pana score of $MIN_PANA_SCORE was not met."
            exit 1
          fi

      - name: Validate publication archive
        run: flutter pub publish --dry-run

      # The GitHub OIDC token is short-lived, so request it right before publishing.
      - name: Configure pub.dev OIDC credentials
        uses: dart-lang/setup-dart@v1

      - name: Publish package
        run: flutter pub publish --force

  release:
    name: Create GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.prepare.outputs.package }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          # Use the CHANGELOG entry of the released version as release notes.
          awk -v version="$VERSION" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' "$PACKAGE/CHANGELOG.md" > release-notes.md
          printf '\nhttps://pub.dev/packages/%s/versions/%s\n' "$PACKAGE" "$VERSION" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$PACKAGE $VERSION" \
            --notes-file release-notes.md

  complete-issues:
    name: Complete issues after successful publication
    needs: [publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release result
    needs: [prepare, publish, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "pub_dev_url": ${{ toJSON(format('https://pub.dev/packages/{0}', needs.prepare.outputs.package || 'contactos')) }},
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
